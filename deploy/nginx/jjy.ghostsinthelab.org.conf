# Web JJY — nginx site config for jjy.ghostsinthelab.org
#
# 静的サイト（index.html / styles.css / jjy.js）を配信する設定。
# デプロイ手順:
#   1. `npm run build` で jjy.js を生成
#   2. index.html / styles.css / jjy.js を web root へ配置
#   3. このファイルを /etc/nginx/sites-available/ に置き、
#      /etc/nginx/sites-enabled/ へシンボリックリンク
#   4. `sudo nginx -t && sudo systemctl reload nginx`
#
# TLS 証明書は certbot (Let's Encrypt) を想定:
#   sudo certbot --nginx -d jjy.ghostsinthelab.org

# --- HTTP: ACME チャレンジ対応 + HTTPS へリダイレクト ---
server {
    listen 80;
    listen [::]:80;
    server_name jjy.ghostsinthelab.org;

    # Let's Encrypt の HTTP-01 チャレンジ用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: 本体 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jjy.ghostsinthelab.org;

    root /var/www/jjy.ghostsinthelab.org;
    index index.html;

    # certbot が --nginx 実行時に下記 2 行を自動で書き換える場合あり
    ssl_certificate     /etc/letsencrypt/live/jjy.ghostsinthelab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjy.ghostsinthelab.org/privkey.pem;

    # モダンな TLS 設定
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # セキュリティヘッダ
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip 圧縮（jjy.js は ~400KB）
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # HTML はキャッシュさせない（更新を即反映）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ビルド済みアセットは長期キャッシュ
    location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ソースや設定ファイルへの直接アクセスを拒否
    location ~ /\.(?!well-known) {
        deny all;
    }
}
